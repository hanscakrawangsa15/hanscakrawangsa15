name: Update Contribution Grid

on:
  schedule:
    - cron: "0 18 * * *"   # tiap hari jam 01:00 WIB (18:00 UTC)
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate contribution.svg from real GitHub data
        env:
          GH_TOKEN: ${{ secrets.GRAPHQL_TOKEN }}
          GH_USERNAME: hanscakrawangsa15
        run: python3 scripts/generate_grid.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/contribution.svg
          git diff --staged --quiet || git commit -m "chore: update contribution grid [auto]"
          git push

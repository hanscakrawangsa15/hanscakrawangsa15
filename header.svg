<svg width="1400" height="620" viewBox="0 0 1400 620" xmlns="http://www.w3.org/2000/svg">
<defs>
  <style>
    .term-bg { fill: #0b0f19; }
    .border { fill: none; stroke: #2ee6a6; stroke-width: 2; rx: 14; }
    .titlebar { fill: #10151f; }
    .noise { font-family: 'Courier New', monospace; font-size: 11px; fill: #1f6f52; letter-spacing: 1px; }
    .label { font-family: 'Courier New', monospace; font-size: 15px; fill: #2ee6a6; font-weight: bold; }
    .value { font-family: 'Courier New', monospace; font-size: 15px; fill: #d7e4ea; }
    .heading { font-family: 'Courier New', monospace; font-size: 17px; fill: #ffffff; font-weight: bold; }
    .dim { font-family: 'Courier New', monospace; font-size: 12px; fill: #4a5568; }
    .prompt { font-family: 'Courier New', monospace; font-size: 13px; fill: #8fa3ad; }
  </style>
  <clipPath id="panelClip">
    <rect x="46" y="150" width="600" height="440" rx="10"/>
  </clipPath>
  <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#2ee6a6" stop-opacity="0"/>
    <stop offset="50%" stop-color="#2ee6a6" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#2ee6a6" stop-opacity="0"/>
  </linearGradient>
</defs>

<rect class="term-bg" width="1400" height="620" rx="16"/>
<rect class="border" x="4" y="4" width="1392" height="612" rx="16"/>

